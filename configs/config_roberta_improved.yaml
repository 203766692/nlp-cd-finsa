# 模型与训练配置，默认面向训练机 GPU 环境
seed: 42
experiment_name: roberta_improved
model_name: hfl/chinese-roberta-wwm-ext
num_labels: 3
dropout: 0.1
max_length: 256

train_file: data/CroFinSA/train.json
valid_file: data/CroFinSA/valid.json
test_file: data/CroFinSA/test.json

# 常见 8GB 至 12GB 显存可从 batch_size 16 起步
batch_size: 16
eval_batch_size: 32
learning_rate: 0.00002
weight_decay: 0.01
epochs: 5
warmup_ratio: 0.1
gradient_accumulation_steps: 1
max_grad_norm: 1.0
num_workers: 4
device: cuda
fp16: true
save_best_metric: macro_f1
use_class_weights: true
early_stopping_patience: 2
